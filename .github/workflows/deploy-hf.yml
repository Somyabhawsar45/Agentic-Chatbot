name: Deploy to Hugging Face Space

# Every push to main copies the app to your Hugging Face Space, which then rebuilds it.
# Setup (once): repo Settings -> Secrets and variables -> Actions:
#   secret   HF_TOKEN  = a Hugging Face access token with "write" permission
#   variable HF_SPACE  = your Space, e.g. yourname/netra-ai
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip if the Space isn't set up yet
        if: env.HF_TOKEN == '' || env.HF_SPACE == ''
        run: echo "Set the HF_TOKEN secret and the HF_SPACE variable to enable deploys."

      - name: Push to the Space
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''
        run: |
          # Hugging Face reads the Space settings from a YAML header at the top of README.md
          {
            printf -- '---\n'
            printf 'title: Netra AI\n'
            printf 'emoji: 👁\n'
            printf 'colorFrom: blue\n'
            printf 'colorTo: indigo\n'
            printf 'sdk: docker\n'
            printf 'app_port: 7860\n'
            printf 'pinned: true\n'
            printf 'short_description: Agentic AI assistant built with LangGraph\n'
            printf -- '---\n\n'
            cat README.md
          } > README.space.md
          mv README.space.md README.md
          rm -rf .git
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7} from GitHub"
          git push --force "https://hf:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
