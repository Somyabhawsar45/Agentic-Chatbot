name: Keep the app awake

# Opens the live app in a real browser about hourly so the host doesn't put it to sleep
# (Streamlit Community Cloud sleeps an app after 12 h without visitors). Each visit also runs the
# app's hourly housekeeping, which keeps a free Supabase database active. GitHub emails you if a
# run fails. Note: GitHub pauses scheduled workflows after 60 days without repo activity.
# Set the app's address once: repo Settings -> Secrets and variables -> Actions -> variable APP_URL
on:
  schedule:
    # GitHub delays and skips scheduled runs under load (runs came 4-6 hours apart even with a
    # 10-minute schedule), so ask often: two staggered hourly runs leave a wide safety margin
    # against the 12-hour sleep limit.
    - cron: '17 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ vars.APP_URL || 'https://netra-agentic-ai.streamlit.app' }}
    steps:
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Visit the app
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.goto(process.env.APP_URL, { waitUntil: 'networkidle', timeout: 120000 });
            await page.waitForTimeout(15000);
            await browser.close();
          })();
          "
